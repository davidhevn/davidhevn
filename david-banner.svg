<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,-apple-system,BlinkMacSystemFont,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes floaty2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes twinkle{0%,100%{opacity:0.3;transform:scale(0.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translateY(-50px);opacity:0}}
.pill{transition:transform .2s ease,filter .2s ease;transform-box:fill-box;transform-origin:center;cursor:pointer}
.pill:hover{transform:scale(1.08);filter:brightness(1.3)}
.cur{animation:blink 1s step-end infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
.fl{animation:floaty 5s ease-in-out infinite}
.fl2{transform-box:fill-box;transform-origin:center;animation:floaty2 4.5s ease-in-out infinite}
.rp{animation:rise linear infinite}
.sep{stroke:#334155;stroke-width:1;opacity:.8}
]]></style>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
