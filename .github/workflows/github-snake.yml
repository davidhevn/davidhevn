name: Generate Profile Visuals & Snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight UTC (07:00 AM VN)
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: davidhevn
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-cyan.svg?color_snake=#38bdf8&color_dots=#0f172a,#1e3a8a,#0284c7,#38bdf8,#a5f3fc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Activity Graph & Streak SVGs
        run: node .github/scripts/generate-graphs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: davidhevn
          OUTPUT_DIR: dist

      - name: Push all visuals to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
