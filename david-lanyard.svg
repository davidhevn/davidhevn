<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 660" width="420" height="660" role="img" aria-label="David HE ID card lanyard">
<title>David HE — Full-Stack &amp; AI Architect ID Badge</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,-apple-system,BlinkMacSystemFont,sans-serif}
@keyframes settle{0%{transform:rotate(0deg) translateY(-660px)}18%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(12deg)}46%{transform:rotate(-8deg)}62%{transform:rotate(5deg)}78%{transform:rotate(-3deg)}92%{transform:rotate(1.5deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes cardWobble{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-1.5deg)}}
@keyframes shine{0%{transform:translateX(-340px) skewX(-18deg)}55%,100%{transform:translateX(420px) skewX(-18deg)}}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pulseGlow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}
.settle{transform-origin:210px 6px;animation:settle 3s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:210px 6px;animation:sway 4.2s ease-in-out 3s infinite}
.wob{transform-origin:210px 300px;animation:cardWobble 4.2s ease-in-out 3s infinite}
.shine{animation:shine 4.5s ease-in-out 3s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
.pg{transform-box:fill-box;transform-origin:center;animation:pulseGlow 2.4s ease-in-out infinite}
]]></style>
<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#0284c7"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/>
</linearGradient>
<linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0f172a"/><stop offset="60%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/>
</linearGradient>
<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%"><animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#cbd5e1"/><stop offset="45%" stop-color="#94a3b8"/><stop offset="55%" stop-color="#64748b"/><stop offset="100%" stop-color="#475569"/>
</linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".18"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="nameg2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="5s" repeatCount="indefinite"/></stop>
</linearGradient>
<radialGradient id="lglow"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<filter id="glow2"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".75"/></filter>
<clipPath id="cardclip"><rect x="82" y="298" width="256" height="330" rx="20"/></clipPath>
<clipPath id="avatarClip"><circle cx="210" cy="415" r="50"/></clipPath>
</defs>

<!-- Ambient background glow -->
<circle cx="210" cy="440" r="230" fill="url(#lglow)"><animate attributeName="r" values="230;255;230" dur="5s" repeatCount="indefinite"/></circle>

<!-- Sparkles & Particles -->
<g class="tw" style="animation-delay:.3s"><path d="M60 200l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#38bdf8"/></g>
<g class="tw" style="animation-delay:1.4s"><path d="M372 300l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#818cf8"/></g>
<g class="tw" style="animation-delay:2.5s"><path d="M52 480l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#c084fc"/></g>
<g class="pg" style="animation-delay:.8s"><circle cx="365" cy="490" r="6" fill="#38bdf8" opacity=".7" filter="url(#glow2)"/></g>

<!-- Pendulum hierarchy: settle then sway -->
<g class="settle"><g class="sway">

  <!-- Strap -->
  <g>
    <path d="M191 -6 L229 -6 L226 236 L194 236 Z" fill="url(#strapg)"/>
    <line x1="196" y1="0" x2="198.5" y2="234" stroke="#fff" stroke-opacity=".6" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="224" y1="0" x2="221.5" y2="234" stroke="#fff" stroke-opacity=".6" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="0" y="0" font-size="9.5" font-weight="900" fill="#ffffff" opacity=".95" letter-spacing="2" transform="translate(214,18) rotate(90)">DAVID.DEV ✦ ARCHITECTURE ✦ AI</text>
  </g>

  <!-- Clasp + ring -->
  <rect x="188" y="232" width="44" height="26" rx="6" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
  <rect x="199" y="238" width="22" height="7" rx="3.5" fill="#1e293b"/>
  <circle cx="210" cy="272" r="14" fill="none" stroke="url(#metal)" stroke-width="5.5"/>

  <!-- Card (secondary wobble) -->
  <g class="wob">
    <rect x="82" y="298" width="256" height="330" rx="20" fill="url(#cardg)" stroke="url(#cardborder)" stroke-width="2" filter="url(#cardShadow)"/>
    <!-- Slot for lanyard clip -->
    <rect x="180" y="310" width="60" height="10" rx="5" fill="#020617" stroke="#1e293b" stroke-width="1"/>

    <g clip-path="url(#cardclip)">
      <!-- Header band -->
      <rect x="82" y="298" width="256" height="36" fill="#1e1b4b" opacity=".75"/>
      <text x="96" y="347" font-size="8.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">DEV ACCESS PASS</text>
      <text x="324" y="347" text-anchor="end" font-size="8.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">DHE-2026</text>

      <!-- Avatar Photo with circular frame & glow -->
      <circle cx="210" cy="415" r="53" fill="none" stroke="url(#cardborder)" stroke-width="2.5"/>
      <image x="160" y="365" width="100" height="100" clip-path="url(#avatarClip)" href="https://raw.githubusercontent.com/davidhevn/davidhevn/main/avatar.jpg" preserveAspectRatio="xMidYMin slice"/>
      <circle cx="210" cy="415" r="50" fill="none" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.5"/>

      <!-- Name & Titles -->
      <text x="210" y="498" text-anchor="middle" font-size="19" font-weight="900" fill="url(#nameg2)" filter="url(#glow2)" letter-spacing="1">David HE</text>
      <text x="210" y="519" text-anchor="middle" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">FULL-STACK &amp; AI ARCHITECT</text>
      <text x="210" y="538" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">@davidhevn</text>

      <!-- Skills badges row in card (Centered at x=210) -->
      <g>
        <rect x="96" y="554" width="52" height="18" rx="9" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="122" y="566.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#38bdf8">C# / .NET</text>

        <rect x="152" y="554" width="50" height="18" rx="9" fill="rgba(129,140,248,0.12)" stroke="#818cf8" stroke-width="0.8"/>
        <text x="177" y="566.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#818cf8">PYTHON</text>

        <rect x="206" y="554" width="44" height="18" rx="9" fill="rgba(192,132,252,0.12)" stroke="#c084fc" stroke-width="0.8"/>
        <text x="228" y="566.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#c084fc">AI/ML</text>

        <rect x="254" y="554" width="58" height="18" rx="9" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="0.8"/>
        <text x="283" y="566.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#4ade80">SYSTEMS</text>
      </g>

      <!-- Hologram / light swipe overlay -->
      <rect class="shine" x="0" y="298" width="80" height="330" fill="url(#shineg)"/>

      <!-- Status dot (Centered at x=210) -->
      <g>
        <circle cx="118" cy="600" r="3.5" fill="#4ade80" filter="url(#glow2)"/>
        <text x="128" y="603" font-size="8.5" font-weight="bold" fill="#4ade80" letter-spacing="1">SYSTEM: ONLINE &amp; OPTIMIZED</text>
      </g>
    </g>
  </g>
</g></g>
</svg>
